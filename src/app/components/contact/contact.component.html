<section id="contact" class="section">
  <div class="max-w-4xl mx-auto">
    <h2 class="section-title">Contact Me</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mt-12">
      <div>
        <p class="text-lg mb-6">
          I'm always open to discussing new projects, opportunities, or
          partnerships. Feel free to reach out!
        </p>

        <div class="space-y-4">
          <div class="flex items-start">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-primary-500 mr-3 mt-0.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
            <div>
              <h3 class="font-bold">Email</h3>
              <a
                [href]="'mailto:' + profile.email"
                class="text-primary-500 hover:text-primary-600 transition"
                >{{ profile.email }}</a
              >
            </div>
          </div>

          <div class="flex items-start">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-primary-500 mr-3 mt-0.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
              />
            </svg>
            <div>
              <h3 class="font-bold">Phone</h3>
              <a
                [href]="'tel:' + profile.phone"
                class="text-primary-500 hover:text-primary-600 transition"
                >{{ profile.phone }}</a
              >
            </div>
          </div>

          <div class="flex items-start">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-primary-500 mr-3 mt-0.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <div>
              <h3 class="font-bold">Location</h3>
              <p>{{ profile.location }}</p>
            </div>
          </div>
        </div>

        <div class="mt-8">
          <h3 class="font-bold mb-4">Connect with me</h3>
          <div class="flex space-x-4">
            <a
              *ngFor="let social of socials"
              [href]="social.href"
              target="_blank"
              rel="noopener"
              [attr.aria-label]="social.label"
              class="text-dark-800 dark:text-white hover:text-primary-500 dark:hover:text-primary-500 transition text-2xl"
            >
              <i [class]="social.icon"></i>
            </a>
          </div>
        </div>
      </div>

      <div>
        <app-contact-form id="classic-contact"></app-contact-form>
      </div>
    </div>
  </div>
</section>
